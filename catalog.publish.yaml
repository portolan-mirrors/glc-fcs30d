# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
#
# Source Cooperative serves these objects. data.source.coop returns raw bytes.
# source.coop renders the human-facing page.

# The S3 URI uploads are written to, through the data.source.coop gateway,
# where the Source Cooperative account is the bucket. Publish with the venv's
# boto3 (the system boto3 1.34 is rejected by the gateway):
#   eval "$(source-coop creds --format env)"; unset AWS_PROFILE
#   AWS_ENDPOINT_URL_S3=https://data.source.coop .venv/bin/python tools/publish.py --confirm
#   AWS_ENDPOINT_URL_S3=https://data.source.coop .venv/bin/python tools/upload_data.py --confirm
# Do not set AWS_PROFILE: a named profile discards the source-coop credentials.
write_prefix: s3://portolan-mirrors/glc-fcs30d

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
public_base: https://data.source.coop/portolan-mirrors/glc-fcs30d

region: us-west-2

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

# The staging directory, outside this repository, for the data files the
# catalog describes that are not COG tiles: items.parquet (tools/items_parquet.py)
# and overview-2022.tif (tools/overview.py). It mirrors the catalog layout, so
# ../staging/publish/glc_fcs30d/x lands at glc_fcs30d/x. The 24,986 COG tiles are
# uploaded by tools/pipeline.py as they are converted.
data_dir: ../staging/publish
